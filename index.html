<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HcCell - Assistência Técnica</title>

  <!-- PWA Meta Tags -->
  <meta name="description" content="Sistema de Gerenciamento de Assistência Técnica - HcCell" />
  <meta name="theme-color" content="#f8fafc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HcCell" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="HcCell" />
  <meta name="msapplication-TileColor" content="#f8fafc" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- PWA Icons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>

<body class="bg-background-light text-slate-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registrado com sucesso:', registration.scope);
          })
          .catch((error) => {
            console.log('Falha ao registrar SW:', error);
          });
      });
    }
  </script>
</body>

</html>
